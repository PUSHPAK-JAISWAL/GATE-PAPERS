name: Package Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create or update a GitHub Release with this APK'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Decoding embedded debug keystore to guarantee consistent signature matching..."
            echo "" | base64 -d > debug.keystore
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-artifacts/GATE-Papers.apk
            cp "$APK_PATH" "release-artifacts/GATE-Papers-v1.0.${{ github.run_number }}.apk"
            ls -lh release-artifacts/
          else
            echo "Error: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GATE-Papers-APK
          path: release-artifacts/GATE-Papers.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=GATE Papers $TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.name }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## GATE Papers Android Application (${{ steps.release_info.outputs.tag }})

            Ready-to-install APK packages:
            - **[GATE-Papers.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/GATE-Papers.apk)** (Standard APK)
            - **[GATE-Papers-${{ steps.release_info.outputs.tag }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/GATE-Papers-${{ steps.release_info.outputs.tag }}.apk)** (Versioned APK)

            ### What's Included:
            - **App Version**: ${{ steps.release_info.outputs.tag }} (Build #${{ github.run_number }})
            - **Live GATE CS & DA Papers**: Dynamic index loaded from GitHub
            - **In-App PDF Viewer & Printing**: Fullscreen reading, zoom & pan, and Android print manager support
            - **Preparation Status Tracker**: Mark papers as Finished or Keep Pending
            - **Filter & Search**: Instant paper search by subject, code, or year
          files: |
            release-artifacts/GATE-Papers.apk
            release-artifacts/GATE-Papers-${{ steps.release_info.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
