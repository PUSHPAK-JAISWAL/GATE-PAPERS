# Note: GitHub Actions strictly expects workflows in .github/workflows/
# This file is provided in .github/workflow/ as a convenient reference.
# The active workflow is maintained in .github/workflows/package-apk.yml

name: Package Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create or update a GitHub Release with this APK'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-artifacts/GATE-Papers.apk
            cp "$APK_PATH" release-artifacts/app-debug.apk
            ls -lh release-artifacts/
          else
            echo "Error: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GATE-Papers-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: "GATE Papers App ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          body: |
            ## GATE Papers Android Application

            Ready-to-install APK package:
            - **GATE-Papers.apk**: Direct install for Android devices (Android 7.0+ / API 24+)

            ### Included Features:
            - **GATE CS & GATE DA** sections with full question paper repository
            - **Dynamic Sync**: Direct integration with `https://github.com/PUSHPAK-JAISWAL/gatecs` and `https://github.com/PUSHPAK-JAISWAL/gateda`
            - **In-App PDF Viewing & A4 Printing**: Clean print formatting for offline practice
            - **Progress Tracking**: Finished and Pending Revisit markers with study notes
            - **File Name Search**: Fast search by question paper file name
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
